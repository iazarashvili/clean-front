# GitHub Pages: nach Push auf main bauen und unter
# https://<USER>.github.io/<REPO-NAME>/ veröffentlichen
#
# pull_request → gleicher Build wie bei Push, aber kein Deploy.
# Einmalig im Repo: Settings → Pages → Source: „GitHub Actions"
# base-href wird in vite.config.ts gesetzt (base: '/clean-front/').

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Production build
        run: npm run build

      - name: SPA refresh auf Unterpfaden (GitHub Pages 404)
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
